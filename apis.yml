name: Robby
description: Robby is an AI-powered growth and job-documentation platform for home-services
  businesses, focused on HVAC contractors. It automates job documentation and paperwork
  for technicians so they can focus on servicing equipment and talking to customers,
  combines customer and third-party data to surface new leads daily, equips technicians
  with talking points to increase sales, and gives management a dashboard to monitor
  the revenue opportunities captured from every visit. Robby is an early-stage Y Combinator
  (Winter 2026) startup that currently publishes a marketing site, blog, and legal
  pages but no public developer API surface.
